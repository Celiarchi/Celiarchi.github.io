backend:
  name: github
  repo: A_REMPLACER/portfolio-celia
  branch: main
  base_url: https://A_REMPLACER.workers.dev
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "site"
    label: "Pages du site"
    files:
      - name: "contenu_general"
        label: "Accueil, à propos et contact"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Titre / métier", name: "role", widget: "string" }
          - { label: "Image de fond de l'accueil", name: "heroImage", widget: "image" }
          - { label: "Courte présentation", name: "intro", widget: "text" }
          - { label: "Titre court à propos", name: "homeAboutTitle", widget: "string" }
          - { label: "Texte court à propos", name: "homeAboutText", widget: "text" }
          - { label: "Titre de la page à propos", name: "aboutTitle", widget: "string" }
          - { label: "Introduction à propos", name: "aboutLead", widget: "text" }
          - { label: "Paragraphe à propos 1", name: "aboutLeft", widget: "text" }
          - { label: "Paragraphe à propos 2", name: "aboutRight", widget: "text" }
          - { label: "Titre galerie", name: "galleryTitle", widget: "string" }
          - { label: "Texte galerie", name: "galleryText", widget: "text" }
          - { label: "Titre contact", name: "contactTitle", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Coordonnées et réseaux", name: "contactDetails", widget: "text" }
          - { label: "Réseaux pour le pied de page", name: "socials", widget: "string" }
  - name: "projects"
    label: "Projets"
    files:
      - name: "liste_projets"
        label: "Tous les projets"
        file: "content/projects.json"
        format: "json"
        fields:
          - label: "Projets"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Identifiant unique", name: "slug", widget: "string", hint: "minuscules, tirets uniquement" }
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options: ["prive", "public"]
              - { label: "Courte description", name: "description", widget: "text" }
              - { label: "Image de couverture", name: "cover", widget: "image", required: false }
              - { label: "Type de couverture", name: "coverKind", widget: "select", options: ["photo", "cutout"], default: "photo" }
              - label: "Images du projet"
                name: "media"
                widget: "list"
                required: false
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Description accessible", name: "alt", widget: "string" }
                  - { label: "Légende", name: "caption", widget: "string", required: false }
                  - { label: "Présentation", name: "kind", widget: "select", options: ["wide", "detail", "process", "cutout", "plan"], default: "wide" }
                  - { label: "Orientation", name: "format", widget: "select", options: ["landscape", "portrait"], default: "landscape" }
              - label: "Mise en page"
                name: "layout"
                widget: "select"
                options: ["portrait", "wide", "square", "tall"]
